[gpio]
# BCM numbering, not the physical header pin number.
hook_pin = 22
record_button_pin = 23
play_button_pin = 24

# true when closing the hook switch to GND means that the handset is on-hook.
# Change to false if the telephone reports the opposite state.
hook_on_hook_when_active = true
bounce_seconds = 0.08

[audio]
capture_device = default
playback_device = default
sample_rate = 16000
channels = 1
max_recording_seconds = 600
minimum_recording_seconds = 1.0

[paths]
recordings = recordings
sounds = sounds

[behaviour]
# Press RECORD once to begin and again to save.
record_button_stops_recording = true
# Press PLAY once to begin and again to stop playback.
play_button_stops_playback = true
avoid_immediate_repeat = true

# Seven fixed positions. GPIO numbers use BCM numbering.
[category_1]
name = Família
folder = familia
pin = 5

[category_2]
name = Amics
folder = amics
pin = 6

[category_3]
name = Viatges
folder = viatges
pin = 13

[category_4]
name = Infància
folder = infancia
pin = 16

[category_5]
name = Somnis
folder = somnis
pin = 19

[category_6]
name = Consells
folder = consells
pin = 20

[category_7]
name = Anècdotes
folder = anecdotes
pin = 21

