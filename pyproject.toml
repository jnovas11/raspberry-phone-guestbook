[project]
name = "raspberry-phone-guestbook"
version = "0.1.0"
description = "Offline two-button audio guestbook for Raspberry Pi"
requires-python = ">=3.11"
dependencies = ["gpiozero>=2.0"]

[project.scripts]
phone-guestbook = "phone_guestbook.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

